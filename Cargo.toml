[workspace]
members = [
    "crates/settings-core",
    "crates/settings-wasm",
    "crates/settings-adapters",
    "crates/settings-accessibility",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
