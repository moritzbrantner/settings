[package]
name = "settings-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
settings-core = { path = "../crates/settings-core" }

[[bin]]
name = "persisted_envelope"
path = "fuzz_targets/persisted_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_v1"
path = "fuzz_targets/migration_v1.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
