name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Validate isolated hardening harnesses
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --bins
          cargo clippy --manifest-path benchmarks/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo fmt --manifest-path benchmarks/Cargo.toml --all -- --check
      - name: Capture allocation evidence
        run: |
          mkdir -p target/evidence
          cargo run --manifest-path benchmarks/Cargo.toml --bin allocation-evidence --quiet > target/evidence/settings-allocation.json
          cat target/evidence/settings-allocation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: settings-allocation-evidence
          path: target/evidence/settings-allocation.json
          if-no-files-found: error

  validate-pages:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["rust", "validate-pages"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "validate-pages"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["validate-pages"]' || '[]' }}
