name: Browser distribution

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-distribution-${{ github.ref }}
  # Never cancel a publication midway on main; superseded pull request runs may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: wasm-pack
      - run: wasm-pack build crates/settings-wasm --target web --release --out-dir ../../dist/pkg --out-name settings_wasm
      - name: Validate browser modules and shared fixture
        run: |
          node --check web/settings-browser.js
          node --check web/settings-react.test.mjs
          node --check web/reference-ui.js
          node web/validate-reference-fixture.mjs
          node --test web/reference-ui-unchanged.test.mjs web/playground/architecture.test.mjs
      - name: Compile and test React UI bridge
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            typescript@5.9.3 react@19.2.0 react-dom@19.2.0 \
            @types/react@19.2.2 @types/react-dom@19.2.2 @moritzbrantner/ui@1.1.0
          rm -rf target/react-bridge
          ./node_modules/.bin/tsc \
            --declaration \
            --outDir target/react-bridge \
            --strict \
            --jsx react-jsx \
            --module ESNext \
            --target ES2022 \
            --moduleResolution Bundler \
            --skipLibCheck \
            web/settings-react.ts
          node --check target/react-bridge/settings-react.js
          node --test web/settings-react.test.mjs
      - name: Test forward-only distribution publisher
        run: |
          node --check scripts/publish-git-dist.mjs
          node --test scripts/publish-git-dist.test.mjs
      - name: Assemble browser distribution
        run: |
          cp web/browser-package.json dist/package.json
          cp web/settings-browser.js dist/settings-browser.js
          cp web/settings-browser.d.ts dist/settings-browser.d.ts
          cp target/react-bridge/settings-react.js dist/settings-react.js
          cp target/react-bridge/settings-react.d.ts dist/settings-react.d.ts
          cp web/index.html dist/index.html
          cp web/reference-ui.js dist/reference-ui.js
          cp web/reference-ui.css dist/reference-ui.css
          cp fixtures/presentation/reference.json dist/reference-settings.json
      - name: Validate installable browser package
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('dist/package.json', 'utf8'));
          if (manifest.name !== '@moritzbrantner/settings-browser') {
            throw new Error('unexpected browser package name');
          }
          if (manifest.types !== './settings-browser.d.ts') {
            throw new Error('browser package types must point at the canonical declarations');
          }
          if (manifest.exports?.['.']?.import !== './settings-browser.js') {
            throw new Error('browser package import must point at the canonical adapter');
          }
          if (manifest.exports?.['./react']?.import !== './settings-react.js') {
            throw new Error('react subpath must point at the React UI bridge');
          }
          if (manifest.exports?.['./react']?.types !== './settings-react.d.ts') {
            throw new Error('react subpath must expose canonical React declarations');
          }
          if (manifest.peerDependencies?.['@moritzbrantner/ui'] !== '>=1.1.0') {
            throw new Error('react bridge must declare the stable shared UI peer');
          }
          for (const path of [
            'dist/settings-browser.js',
            'dist/settings-browser.d.ts',
            'dist/settings-react.js',
            'dist/settings-react.d.ts',
            'dist/pkg/settings_wasm.js',
            'dist/pkg/settings_wasm_bg.wasm',
          ]) {
            if (!fs.existsSync(path)) throw new Error(`missing ${path}`);
          }
          NODE
      - name: Validate React UI consumer contract
        run: |
          mkdir -p target/react-contract
          cat > target/react-contract/contract.tsx <<'TSX'
          import { SettingsBooleanField } from '../../dist/settings-react.js';
          import type {
            PresentationEntry,
            SettingDefinition,
            SettingValue,
          } from '../../dist/settings-browser.js';

          const definition = {
            id: 'accessibility.reduce_motion',
            kind: { type: 'bool' },
            default: { type: 'bool', value: false },
            scope: 'user',
            apply_mode: 'immediate',
          } as const satisfies SettingDefinition;
          const presentation = {
            id: definition.id,
            metadata: {
              label_key: 'settings.reduceMotion.title',
              description_key: 'settings.reduceMotion.description',
              category_key: 'settings.presentation',
            },
          } as const satisfies PresentationEntry;
          const value = { type: 'bool', value: true } as const satisfies SettingValue;

          const field = (
            <SettingsBooleanField
              definition={definition}
              presentation={presentation}
              value={value}
              localize={(key) => key}
              onValueChange={() => undefined}
            />
          );
          void field;
          TSX
          ./node_modules/.bin/tsc \
            --noEmit \
            --strict \
            --jsx react-jsx \
            --module ESNext \
            --target ES2022 \
            --moduleResolution Bundler \
            target/react-contract/contract.tsx
          node -e "import('./dist/settings-react.js').then(({ SettingsBooleanField }) => { if (typeof SettingsBooleanField !== 'function') throw new Error('missing SettingsBooleanField export'); })"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: settings-browser-dist
          path: dist
          if-no-files-found: error

  playground:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Reuse the assembled installable package (adapter, declarations and WASM) from `build`.
      SETTINGS_BROWSER_DIST: ${{ github.workspace }}/dist
    defaults:
      run:
        working-directory: web/playground
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: settings-browser-dist
          path: dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type-check and build the Settings Playground
        run: |
          bun run build:browser-package
          bun run check-types
          bunx vite build
      - run: bunx playwright install --with-deps chromium
      - name: Settings Playground browser journeys
        run: bunx playwright test --workers=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: settings-playground-playwright-report
          path: |
            web/playground/playwright-report
            web/playground/test-results
          if-no-files-found: ignore

  prepare:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: settings-browser-dist
          path: dist
      - name: Prepare browser distribution commit (dry run)
        run: |
          set -euo pipefail
          node scripts/publish-git-dist.mjs --dist dist --source "$SOURCE_SHA" > git-dist.json
          { echo '```json'; cat git-dist.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: settings-browser-dist
          path: dist
      - name: Publish browser distribution commit (forward-only)
        run: |
          set -euo pipefail
          node scripts/publish-git-dist.mjs --dist dist --source "$SOURCE_SHA" --push > git-dist.json
          { echo '```json'; cat git-dist.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_SHA: ${{ github.sha }}
