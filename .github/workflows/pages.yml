name: Browser distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build crates/settings-wasm --target web --release --out-dir ../../dist/pkg --out-name settings_wasm
      - run: cp web/settings-browser.js dist/settings-browser.js
      - uses: actions/upload-artifact@v4
        with:
          name: settings-browser-dist
          path: dist
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: settings-browser-dist
          path: dist
      - name: Publish generated browser distribution
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R dist/. "$publish_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan browser-dist
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -R "$publish_dir/." .
          touch .nojekyll
          printf '%s\n' "$SOURCE_SHA" > SOURCE_SHA
          git add -A
          git commit -m "Publish browser distribution for $SOURCE_SHA"
          git push --force origin HEAD:browser-dist
